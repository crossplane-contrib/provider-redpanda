    redpanda_topic:
        subCategory: ""
        description: Topic represents a Kafka topic configuration
        name: redpanda_topic
        title: redpanda_topic Resource - terraform-provider-redpanda
        examples:
            - name: example
              manifest: |-
                {
                  "cluster_api_url": "${redpanda_cluster.example.cluster_api_url}",
                  "configuration": {
                    "cleanup.policy": "delete",
                    "retention.ms": "604800000"
                  },
                  "name": "example-topic",
                  "partition_count": 3,
                  "replication_factor": 3
                }
              references:
                cluster_api_url: redpanda_cluster.example.cluster_api_url
              dependencies:
                redpanda_cluster.example: |-
                    {
                      "cloud_provider": "aws",
                      "cluster_type": "dedicated",
                      "connection_type": "public",
                      "name": "example-cluster",
                      "network_id": "${redpanda_network.example.id}",
                      "region": "us-west-2",
                      "resource_group_id": "${redpanda_resource_group.example.id}",
                      "throughput_tier": "tier-1-aws",
                      "zones": [
                        "us-west-2a",
                        "us-west-2b",
                        "us-west-2c"
                      ]
                    }
                redpanda_network.example: |-
                    {
                      "cidr_block": "10.0.0.0/20",
                      "cloud_provider": "aws",
                      "cluster_type": "dedicated",
                      "name": "example-network",
                      "region": "us-west-2",
                      "resource_group_id": "${redpanda_resource_group.example.id}"
                    }
                redpanda_resource_group.example: |-
                    {
                      "name": "example-resource-group"
                    }
        argumentDocs:
            allow_deletion: (Boolean) Indicates whether the topic can be deleted.
            cluster_api_url: (String) The cluster API URL. Changing this will prevent deletion of the resource on the existing cluster. It is generally a better idea to delete an existing resource and create a new one than to change this value unless you are planning to do state imports
            configuration: (Map of String) A map of string key/value pairs of topic configurations.
            id: (String) The ID of this resource.
            name: (String) The name of the topic.
            partition_count: (Number) The number of partitions for the topic. This determines how the data is distributed across brokers. Increases are fully supported without data loss. Decreases will destroy and recreate the topic if allow_deletion is set to true (defaults to false).
            replication_factor: (Number) The replication factor for the topic, which defines how many copies of the data are kept across different brokers for fault tolerance.
