    redpanda_schema:
        subCategory: ""
        description: Schema represents a Schema Registry schema
        name: redpanda_schema
        title: redpanda_schema Resource - terraform-provider-redpanda
        examples:
            - name: example
              manifest: |-
                {
                  "cluster_id": "${redpanda_cluster.example.id}",
                  "password": "secure-password-123",
                  "schema": "${jsonencode({\n    type = \"record\"\n    name = \"User\"\n    fields = [\n      {\n        name = \"id\"\n        type = \"long\"\n      },\n      {\n        name = \"username\"\n        type = \"string\"\n      },\n      {\n        name = \"email\"\n        type = \"string\"\n      }\n    ]\n  })}",
                  "schema_type": "AVRO",
                  "subject": "user-value",
                  "username": "${redpanda_user.example.name}"
                }
              references:
                cluster_id: redpanda_cluster.example.id
                username: redpanda_user.example.name
              dependencies:
                redpanda_cluster.example: |-
                    {
                      "cloud_provider": "aws",
                      "cluster_type": "dedicated",
                      "connection_type": "public",
                      "name": "example-cluster",
                      "network_id": "${redpanda_network.example.id}",
                      "region": "us-west-2",
                      "resource_group_id": "${redpanda_resource_group.example.id}",
                      "throughput_tier": "tier-1-aws",
                      "zones": [
                        "us-west-2a",
                        "us-west-2b",
                        "us-west-2c"
                      ]
                    }
                redpanda_network.example: |-
                    {
                      "cidr_block": "10.0.0.0/20",
                      "cloud_provider": "aws",
                      "cluster_type": "dedicated",
                      "name": "example-network",
                      "region": "us-west-2",
                      "resource_group_id": "${redpanda_resource_group.example.id}"
                    }
                redpanda_resource_group.example: |-
                    {
                      "name": "example-resource-group"
                    }
                redpanda_user.example: |-
                    {
                      "allow_deletion": true,
                      "cluster_api_url": "${redpanda_cluster.example.cluster_api_url}",
                      "mechanism": "scram-sha-256",
                      "name": "schema-user",
                      "password": "secure-password-123"
                    }
        argumentDocs:
            BACKWARD: '(default): New schema can read data written with the previous schema'
            BACKWARD_TRANSITIVE: ': Backward compatibility with all previous versions'
            FORWARD: ': Previous schema can read data written with the new schema'
            FORWARD_TRANSITIVE: ': Forward compatibility with all previous versions'
            FULL: ': Both backward and forward compatibility'
            FULL_TRANSITIVE: ': Both backward and forward compatibility with all previous versions'
            NONE: ': No compatibility checking'
            REDPANDA_SR_PASSWORD: for the password
            REDPANDA_SR_USERNAME: for the username
            allow_deletion: (Boolean) When enabled, prevents the resource from being deleted if the cluster is unreachable. When disabled (default), the resource will be removed from state without attempting deletion when the cluster is unreachable.
            cluster_id: (String) The ID of the cluster where the schema is stored.
            compatibility: (String) The compatibility level for schema evolution (BACKWARD, BACKWARD_TRANSITIVE, FORWARD, FORWARD_TRANSITIVE, FULL, FULL_TRANSITIVE, NONE). Defaults to BACKWARD.
            id: (Number) The unique identifier for the schema.
            name: (String) The name of the referenced schema.
            password: (String, Sensitive) The SASL password for Schema Registry authentication.
            references: (Attributes List) List of schema references. (see below for nested schema)
            schema: (String) The schema definition in JSON format.
            schema_type: (String) The type of schema (AVRO, JSON, PROTOBUF).
            subject: (String) The subject name for the schema.
            username: (String) The SASL username for Schema Registry authentication.
            version: (Number) The version of the schema.
        importStatements:
            - |-
              # Import a schema with version 1
              terraform import redpanda_schema.example "cluster-123:user-value:1:myuser:mypassword"

              # Import a schema with a complex subject name
              terraform import redpanda_schema.product "cluster-456:com.example.Product-v2:5:admin:secret123"

              # Import schema version 0
              terraform import redpanda_schema.initial "cluster-789:test-subject:0:svc_account:p@ssw0rd"
    redpanda_schema_registry_acl:
        subCategory: ""
        description: Resource for managing Redpanda Schema Registry ACLs (Access Control Lists). This resource allows you to configure fine-grained access control for Schema Registry resources.
        name: redpanda_schema_registry_acl
        title: redpanda_schema_registry_acl Resource - terraform-provider-redpanda
        examples:
            - name: example
              manifest: |-
                {
                  "cluster_id": "${redpanda_cluster.example.id}",
                  "depends_on": [
                    "${redpanda_acl.schema_registry_admin}"
                  ],
                  "host": "*",
                  "operation": "READ",
                  "password": "secure-password-123",
                  "pattern_type": "LITERAL",
                  "permission": "ALLOW",
                  "principal": "User:${redpanda_user.example.name}",
                  "resource_name": "user-value",
                  "resource_type": "SUBJECT",
                  "username": "${redpanda_user.example.name}"
                }
              references:
                cluster_id: redpanda_cluster.example.id
                username: redpanda_user.example.name
              dependencies:
                redpanda_acl.schema_registry_admin: |-
                    {
                      "cluster_api_url": "${redpanda_cluster.example.cluster_api_url}",
                      "host": "*",
                      "operation": "ALTER",
                      "permission_type": "ALLOW",
                      "principal": "User:${redpanda_user.example.name}",
                      "resource_name": "kafka-cluster",
                      "resource_pattern_type": "LITERAL",
                      "resource_type": "CLUSTER"
                    }
                redpanda_cluster.example: |-
                    {
                      "cloud_provider": "aws",
                      "cluster_type": "dedicated",
                      "connection_type": "public",
                      "name": "example-cluster",
                      "network_id": "${redpanda_network.example.id}",
                      "region": "us-west-2",
                      "resource_group_id": "${redpanda_resource_group.example.id}",
                      "throughput_tier": "tier-1-aws",
                      "zones": [
                        "us-west-2a",
                        "us-west-2b",
                        "us-west-2c"
                      ]
                    }
                redpanda_network.example: |-
                    {
                      "cidr_block": "10.0.0.0/20",
                      "cloud_provider": "aws",
                      "cluster_type": "dedicated",
                      "name": "example-network",
                      "region": "us-west-2",
                      "resource_group_id": "${redpanda_resource_group.example.id}"
                    }
                redpanda_resource_group.example: |-
                    {
                      "name": "example-resource-group"
                    }
                redpanda_user.example: |-
                    {
                      "allow_deletion": true,
                      "cluster_api_url": "${redpanda_cluster.example.cluster_api_url}",
                      "mechanism": "scram-sha-256",
                      "name": "schema-user",
                      "password": "secure-password-123"
                    }
        argumentDocs:
            ALL: ': All operations (use with caution)'
            ALTER: ': Modify subject settings'
            ALTER_CONFIGS: ': Modify compatibility and other configuration settings'
            DELETE: ': Delete schemas and subjects'
            DESCRIBE: ': View subject and schema metadata'
            DESCRIBE_CONFIGS: ': View compatibility and other configuration settings'
            LITERAL: ': Exact match on resource name'
            PREFIXED: ': Match resources that start with the specified prefix'
            READ: ': Read schemas and subject metadata'
            REDPANDA_SR_PASSWORD: for the password
            REDPANDA_SR_USERNAME: for the username
            WRITE: ': Create and update schemas'
            allow_deletion: (Boolean) When set to true, allows the resource to be removed from state even if deletion fails due to permission errors
            cluster_id: (String) The ID of the cluster where the Schema Registry ACL will be created
            host: (String) The host address to use for this ACL. Use '*' for wildcard
            id: (String) The ID of this resource.
            operation: '(String) The operation type that shall be allowed or denied: ALL, READ, WRITE, DELETE, DESCRIBE, DESCRIBE_CONFIGS, ALTER, ALTER_CONFIGS'
            password: (String, Sensitive) Password for authentication. Can be set via REDPANDA_SR_PASSWORD environment variable
            pattern_type: '(String) The pattern type of the resource: LITERAL or PREFIXED'
            permission: '(String) The permission type: ALLOW or DENY'
            principal: (String) The principal to apply this ACL for (e.g., User:alice or RedpandaRole:admin)
            resource_name: (String) The name of the resource this ACL entry will be on. Use '*' for wildcard
            resource_type: '(String) The type of the resource: SUBJECT or REGISTRY'
            username: (String, Sensitive) Username for authentication. Can be set via REDPANDA_SR_USERNAME environment variable
        importStatements:
            - |-
              # Import a subject-level READ ACL for user alice
              terraform import redpanda_schema_registry_acl.example "cluster-123:User:alice:SUBJECT:user-value:LITERAL:*:READ:ALLOW:alice:mypassword"

              # Import a registry-level ALL ACL for a role
              terraform import redpanda_schema_registry_acl.admin "cluster-123:RedpandaRole:admin:REGISTRY:*:LITERAL:*:ALL:ALLOW:admin:secret"

              # Import a prefixed pattern ACL
              terraform import redpanda_schema_registry_acl.prefix "cluster-123:User:bob:SUBJECT:orders-:PREFIXED:*:WRITE:ALLOW:bob:pass123"
    redpanda_serverless_cluster:
        subCategory: ""
