apiVersion: schema.redpanda.crossplane.io/v1alpha1
kind: RegistryACL
metadata:
  annotations:
    meta.upbound.io/example-id: schema/v1alpha1/registryacl
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    clusterIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    host: '*'
    operation: READ
    passwordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    patternType: LITERAL
    permission: ALLOW
    principal: example-user
    resourceName: user-value
    resourceType: SUBJECT
    usernameSecretRef:
      key: attribute.name
      name: example-user
      namespace: upbound-system

---

apiVersion: redpanda.redpanda.crossplane.io/v1alpha1
kind: ACL
metadata:
  annotations:
    meta.upbound.io/example-id: schema/v1alpha1/registryacl
  labels:
    testing.upbound.io/example-name: schema_registry_admin
  name: schema-registry-admin
spec:
  forProvider:
    clusterApiUrlSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    host: '*'
    operation: ALTER
    permissionType: ALLOW
    principal: schema-user
    resourceNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    resourcePatternType: LITERAL
    resourceType: CLUSTER

---

apiVersion: redpanda.redpanda.crossplane.io/v1alpha1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: schema/v1alpha1/registryacl
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    cloudProviderSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    clusterTypeSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    connectionType: public
    name: example-cluster
    networkIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    regionSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    resourceGroupIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    throughputTier: tier-1-aws
    zones:
    - us-west-2a
    - us-west-2b
    - us-west-2c

---

apiVersion: redpanda.redpanda.crossplane.io/v1alpha1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: schema/v1alpha1/registryacl
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    cidrBlock: 10.0.0.0/20
    cloudProvider: aws
    clusterType: dedicated
    name: example-network
    region: us-west-2
    resourceGroupIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: resource.redpanda.crossplane.io/v1alpha1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: schema/v1alpha1/registryacl
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    name: example-resource-group

---

apiVersion: redpanda.redpanda.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: schema/v1alpha1/registryacl
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    allowDeletion: true
    clusterApiUrlSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    mechanism: scram-sha-256
    name: schema-user
    passwordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
