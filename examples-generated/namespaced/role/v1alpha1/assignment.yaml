apiVersion: role.redpanda.m.crossplane.io/v1alpha1
kind: Assignment
metadata:
  annotations:
    meta.upbound.io/example-id: role/v1alpha1/assignment
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    clusterApiUrlSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    principalSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    roleName: test-role

---

apiVersion: redpanda.redpanda.m.crossplane.io/v1alpha1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: role/v1alpha1/assignment
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    cloudProviderSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    clusterTypeSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    connectionType: public
    name: example-cluster
    networkIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    regionSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    resourceGroupIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    throughputTier: tier-1-aws
    zones:
    - us-west-2a
    - us-west-2b
    - us-west-2c

---

apiVersion: redpanda.redpanda.m.crossplane.io/v1alpha1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: role/v1alpha1/assignment
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    cidrBlock: 10.0.0.0/20
    cloudProvider: aws
    clusterType: dedicated
    name: example-network
    region: us-west-2
    resourceGroupIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: resource.redpanda.m.crossplane.io/v1alpha1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: role/v1alpha1/assignment
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    name: example-resource-group

---

apiVersion: redpanda.redpanda.m.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: role/v1alpha1/assignment
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    allowDeletion: true
    clusterApiUrlSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    mechanism: scram-sha-256
    name: example-user
    passwordSecretRef:
      key: example-key
      name: example-secret
