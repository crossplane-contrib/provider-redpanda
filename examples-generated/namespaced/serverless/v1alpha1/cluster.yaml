apiVersion: serverless.redpanda.m.crossplane.io/v1alpha1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: serverless/v1alpha1/cluster
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    name: example-serverless-cluster
    region: us-west-2
    resourceGroupId: ${redpanda_resource_group.example.id}

---

apiVersion: resource.redpanda.m.crossplane.io/v1alpha1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: serverless/v1alpha1/cluster
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    name: example-resource-group
